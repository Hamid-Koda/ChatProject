{% extends "base.html" %}
{% load i18n %}

{% block content %}
    <h2>{% trans "Change Password" %}</h2>

    {% if form %}
        <form method="post" action=".">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="button button-primary">{% trans "Change Password" %}</button>
        </form>
    {% else %}
        <p>{% trans 'Your password is now changed.' %}</p>
    {% endif %}
{% endblock %}
