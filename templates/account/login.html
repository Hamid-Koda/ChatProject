{% extends "base.html" %}
{% load i18n %}

{% block content %}
    <h2>{% trans "Sign In" %}</h2>

    {% include "socialaccount/snippets/provider_list.html" with process="login" %}

    <div class="divider">{% trans 'or' %}</div>

    <form class="login" method="post" action="{% url 'account_login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button button-primary">{% trans "Sign In" %}</button>
    </form>

    <div class="links">
        <a href="{% url 'account_signup' %}">{% trans "Don't have an account? Sign Up" %}</a>
    </div>
{% endblock %}
