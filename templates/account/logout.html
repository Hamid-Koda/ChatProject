{% extends "base.html" %}
{% load i18n %}

{% block content %}
    <h2>{% trans "Sign Out" %}</h2>

    <p style="margin-bottom: 2em;">{% trans "?Are you sure you want to sign out" %}</p>

    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit" class="button button-danger">{% trans "Sign Out" %}</button>
    </form>

    <div style="margin-top: 1em;">
        <a href="{% url 'chat_page' %}" class="button button-secondary">{% trans "Return to Chat" %}</a>
    </div>
{% endblock %}
