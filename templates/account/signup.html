{% extends "base.html" %}
{% load i18n %}

{% block content %}
    <h2>{% trans "Sign Up" %}</h2>
    
    {% include "socialaccount/snippets/provider_list.html" with process="signup" %}

    <div class="divider">{% trans 'or' %}</div>

    <form class="signup" id="signup_form" method="post" action="{% url 'account_signup' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button button-primary">{% trans "Sign Up" %}</button>
    </form>
    
    <div class="links">
        <a href="{% url 'account_login' %}">{% trans "Already have an account? Sign In" %}</a>
    </div>
{% endblock %}
