<!DOCTYPE html>
<html>
<head>
    <title>پروژه چت</title>

        .error { background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    {% for message in messages %}
        <div class="error">{{ message }}</div>
    {% endfor %}

    {% block content %}
    {% endblock %}
</body>
</html>
